[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "howmid"
version = "0.1.0"
description = "How Mid Am I? — a grounded conversational agent that projects everyday swim/bike/run PRs onto Ironman-equivalent performance and reports a real percentile vs. the historical field."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Core dependencies = the deterministic number path ONLY.
# DuckDB for the percentile engine, pandas/numpy for the eval oracle, sqlglot
# for the read-only SQL guard. Deliberately NO anthropic / langgraph here — the
# math layer must install and run without the LLM stack (see [project.optional-dependencies]).
dependencies = [
    "duckdb>=1.5",
    "pandas>=3.0",
    "numpy>=2.0",
    "sqlglot>=27",
]

[project.optional-dependencies]
# The LLM + orchestration layer. Installed on top of the core for the full app.
agent = [
    "anthropic>=0.40",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
]
# The data-engineering layer (offline transforms: clean_results -> marts).
dbt = [
    "dbt-duckdb>=1.9",
]
# The public chat UI + production hygiene.
app = [
    "gradio>=5",
    "slowapi>=0.1.9",
]
# Everything, for local development.
dev = [
    "howmid[agent,dbt,app]",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/howmid"]

[tool.uv]
# uv manages the project venv from this file + uv.lock (committed = reproducible).
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" for the howmid package; "." so eval/ (the oracle, used as an independent
# cross-check in tests) is importable as a top-level module from the repo root.
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests", "eval", "app"]
